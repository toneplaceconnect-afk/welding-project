<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/nocturne-651ddb0a-0612-474c-8ab1-e169f277ba98/styles.css">
  <script src="_ds/nocturne-651ddb0a-0612-474c-8ab1-e169f277ba98/_ds_bundle.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Unbounded:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--color-accent:#cf2026;--radius-sm:0px;--radius-md:2px;--radius-lg:2px}
    html.js-reveal [data-reveal]{opacity:0;transform:translateY(18px)}
    html.js-reveal [data-reveal].in{opacity:1;transform:none;transition:opacity .55s cubic-bezier(.2,.7,.2,1),transform .55s cubic-bezier(.2,.7,.2,1)}
    
    @keyframes logoflash{0%,88%,100%{opacity:.15;transform:scale(.7)}92%{opacity:1;transform:scale(1.25)}95%{opacity:.45;transform:scale(.95)}97%{opacity:.9;transform:scale(1.1)}}
    a{color:#cf2026;text-decoration:none}
    a:hover{color:#a8171c}
    body,h1,h2,h3,h4,h5,h6,p,span,a,div,label,button,input,select,textarea,figcaption,li,td,th{font-family:'Michroma','Unbounded','Inter',system-ui,sans-serif}
    p,li{letter-spacing:-.03em;word-spacing:-.06em}
  </style>
</helmet>

<div style="background:#ffffff;color:#16181f;min-height:100vh">


  <section style="background:#11131a">
    <div style="max-width:1240px;margin:0 auto;padding:56px 28px 48px">
      <span style="font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#8d92a3">{{ docs_hero_eyebrow }}</span>
      <h1 style="font-size:clamp(22px,3.4vw,38px);font-weight:700;color:#fff;margin:14px 0 14px;max-width:900px;line-height:1.25;text-wrap:balance">{{ docs_hero_title }}</h1>
      <p style="font-size:13px;line-height:1.8;color:#b9bdcb;max-width:740px;margin:0">{{ docs_hero_text }}</p>
    </div>
  </section>

  <section style="background:#f4f5f7">
    <div style="max-width:1240px;margin:0 auto;padding:48px 28px 56px;display:flex;flex-direction:column;gap:44px">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
        <div>
          <div data-reveal style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:20px">
            <span style="width:34px;height:3px;background:#cf2026;display:inline-block"></span>
            <h2 style="font-size:clamp(16px,2.2vw,22px);font-weight:700;text-transform:uppercase;margin:0;line-height:1.4">{{ g.title }}</h2>
            <p style="font-size:10.5px;color:#8d92a3;margin:0">{{ g.sub }}</p>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px">
            <sc-for list="{{ g.items }}" as="d" hint-placeholder-count="3">
              <article data-reveal style="background:#fff;padding:22px;box-shadow:0 10px 30px rgba(10,12,18,.08);transition:transform .3s,box-shadow .3s" style-hover="transform:translateY(-4px);box-shadow:0 16px 38px rgba(10,12,18,.14)">
                <span style="display:block;font-size:10px;font-weight:700;color:#cf2026;letter-spacing:.06em;margin-bottom:10px">{{ d.code }}</span>
                <h3 style="font-size:11.5px;font-weight:700;margin:0 0 8px;line-height:1.6">{{ d.name }}</h3>
                <p style="font-size:10.5px;color:#6a6f80;margin:0;line-height:1.9">{{ d.desc }}</p>
              </article>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="background:#cf2026">
    <div style="max-width:1240px;margin:0 auto;padding:40px 28px;display:flex;gap:24px;flex-wrap:wrap;align-items:center;justify-content:space-between">
      <p data-reveal style="margin:0;max-width:700px;color:#fff;font-size:11.5px;line-height:1.9">{{ docs_banner_text }}</p>
      <a href="Калькулятор.dc.html" style="background:#fff;color:#cf2026;padding:14px 26px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transition:background .25s" style-hover="background:#ffe3e4">{{ docs_banner_cta }}</a>
    </div>
  </section>


</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  componentDidMount() {
    document.documentElement.classList.add('js-reveal');
    const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting || e.boundingClientRect.top < 0) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: 0.05 });
    this._io = io;
    const scan = () => document.querySelectorAll('[data-reveal]:not(.in)').forEach((el) => {
      if (el.getBoundingClientRect().top < window.innerHeight * 0.94) el.classList.add('in');
      else io.observe(el);
    });
    scan();
    this._scan = scan;
    window.addEventListener('scroll', scan, { passive: true });
    window.addEventListener('resize', scan);
    this._onScroll = () => {
      const b = document.getElementById('totop');
      if (!b) return;
      const on = window.scrollY > 500;
      b.style.opacity = on ? '1' : '0';
      b.style.pointerEvents = on ? 'auto' : 'none';
    };
    window.addEventListener('scroll', this._onScroll, { passive: true });
    this._onScroll();
    const _cmsApply = async () => {
      try {
        const r = await fetch('/content.json?t=' + Date.now());
        if (!r.ok) return;
        const cms = await r.json();
        window.__CMS_DATA__ = cms;
        if (window.__applyCMS) window.__applyCMS();
        try { this.setState({}); } catch(e2) {}
      } catch(e) {}
    };
    _cmsApply();
    setTimeout(_cmsApply, 600);
    setTimeout(_cmsApply, 1800);
  }
  componentWillUnmount() {
    if (this._scan) { window.removeEventListener('scroll', this._scan); window.removeEventListener('resize', this._scan); }
    if (this._io) this._io.disconnect();
    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);
  }

  renderVals() {
    const d = (window.__CMS_DATA__ && window.__CMS_DATA__.pages && window.__CMS_DATA__.pages.docs) || {};
    return {
      toTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }),
      docs_hero_eyebrow: d.hero_eyebrow || 'Документация',
      docs_hero_title: d.hero_title || 'Работаю по СП и ГОСТ, а не на глаз',
      docs_hero_text: d.hero_text || 'Каждый проект — забор, навес, отопление или мебель — рассчитывается с опорой на действующие своды правил. Именно эти нормы определяют шаг столбов, глубину заглубления, сечение трубы и мощность отопления в вашем проекте.',
      docs_banner_text: d.banner_text || 'Расчёты на сайте дают предварительную оценку. Точное количество материалов и итоговый проект фиксируются после выезда на объект и уточнения грунта и нагрузок под ваш конкретный участок.',
      docs_banner_cta: d.banner_cta || 'Открыть калькулятор',
      groups: (Array.isArray(d.groups) ? d.groups : [
        {
          title: 'Металлоконструкции и сварка', sub: 'Проектирование каркасов, изготовление, типы швов',
          items: [
            { code: 'СП 16.13330.2017', name: 'Стальные конструкции', desc: 'Сечения труб, узлы и несущая способность каркасов заборов, навесов и лестниц.' },
            { code: 'ГОСТ 23118-2012', name: 'Конструкции стальные строительные', desc: 'Общие технические условия: допуски, контроль качества, приёмка изделия.' },
            { code: 'ГОСТ 5264-80', name: 'Ручная дуговая сварка. Соединения сварные', desc: 'Типы соединений и элементы шва — база для расчёта расхода электродов.' },
            { code: 'ВСН 416-81 / 452-84', name: 'Нормы расхода материалов. Сварочные работы', desc: 'Табличные нормы расхода электродов и проволоки на погонный метр шва по катету.' }
          ]
        },
        {
          title: 'Нагрузки и основания', sub: 'Почему забор не «парусит», а навес не складывается под снегом',
          items: [
            { code: 'СП 20.13330.2016', name: 'Нагрузки и воздействия', desc: 'Карты снеговых и ветровых районов — расчётные нагрузки беру по вашему адресу, без «средних по России».' },
            { code: 'СП 22.13330.2016', name: 'Основания зданий и сооружений', desc: 'Глубина сезонного промерзания и коэффициенты по типу грунта — отсюда заглубление столбов.' },
            { code: 'СП 131.13330', name: 'Строительная климатология', desc: 'Климатические данные по населённому пункту для расчётов вместе с СП 20 и СП 22.' }
          ]
        },
        {
          title: 'Пожарная безопасность', sub: 'Навесы, беседки и мангальные зоны рядом с домом',
          items: [
            { code: 'СП 4.13130.2013', name: 'Противопожарные расстояния', desc: 'Расстояния от постройки с деревянными элементами до дома и соседних строений.' },
            { code: 'СП 55.13330.2016', name: 'Дома жилые одноквартирные', desc: 'Требования к дому, куда монтируется отопление и лестницы; отсылка к СП 4.13130.' }
          ]
        },
        {
          title: 'Отопление', sub: 'Мощность, теплопотери, изоляция трубопроводов',
          items: [
            { code: 'СП 60.13330.2020', name: 'Отопление, вентиляция и кондиционирование', desc: 'Основной документ проектирования систем отопления и требований к оборудованию.' },
            { code: 'СП 50.13330.2012', name: 'Тепловая защита зданий', desc: 'Расчёт теплопотерь дома — по нему уточняется мощность вместо нормы 100 Вт/м².' },
            { code: 'СП 61.13330.2012', name: 'Тепловая изоляция трубопроводов', desc: 'Толщина утеплителя по диаметру трубы.' },
            { code: 'СП 62.13330.2011', name: 'Газораспределительные системы', desc: 'Для газового котла: подключение к газу — зона ответственности спецорганизации.' }
          ]
        },
        {
          title: 'Водоснабжение и электрика', sub: 'Расходы воды, диаметры, ввод и щит',
          items: [
            { code: 'СП 30.13330.2020', name: 'Внутренний водопровод и канализация зданий', desc: 'Расчёт расходов воды, диаметров труб и подбор оборудования внутри дома.' },
            { code: 'СП 31.13330', name: 'Водоснабжение. Наружные сети', desc: 'Скважина, колодец, ввод воды на участке.' },
            { code: 'ПУЭ, 7-е изд.', name: 'Правила устройства электроустановок', desc: 'Сечения кабеля, защита групп, заземление — по ним считается щит и трассы.' }
          ]
        }
      ])
    };
  }
}

</script>
