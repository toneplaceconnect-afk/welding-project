name: Apply mobile UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject favicon and mobile stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = list(Path('.').glob('*.dc.html')) + [Path('create.html')]
          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              changed = False

              if 'assets/favicon.svg' not in text:
                  marker = '<meta name="viewport"'
                  pos = text.find(marker)
                  if pos != -1:
                      end = text.find('>', pos)
                      if end != -1:
                          insert = '\n<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">\n<meta name="theme-color" content="#11131a">'
                          text = text[:end+1] + insert + text[end+1:]
                          changed = True

              if 'href="mobile.css"' not in text:
                  marker = '</head>'
                  if marker in text:
                      text = text.replace(marker, '  <link rel="stylesheet" href="mobile.css">\n</head>', 1)
                      changed = True

              if changed:
                  path.write_text(text, encoding='utf-8')
          PY
      - name: Commit mobile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.dc.html' create.html
          git diff --cached --quiet || git commit -m "Apply mobile layout and favicon [mobile-sync]"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/apply-mobile-ui.yml
          git add .github/workflows/apply-mobile-ui.yml
          git diff --cached --quiet || git commit -m "Remove temporary mobile sync workflow [mobile-sync]"
          git push
