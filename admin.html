<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админ-панель — Проект-Сварка</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Michroma','Unbounded','Inter',system-ui,sans-serif;background:#0d0f15;color:#c9ccd6;min-height:100vh}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:22px}
.login-box{background:#1a1d27;border:1px solid #2a2d3a;border-radius:8px;padding:36px 32px;width:100%;max-width:380px;text-align:center}
.login-box h1{font-size:16px;color:#fff;margin-bottom:8px}
.login-box p{font-size:11px;color:#717785;margin-bottom:24px}
.login-box input{width:100%;padding:12px 14px;border:1px solid #3a3d4a;border-radius:4px;background:#11131a;color:#fff;font-size:13px;margin-bottom:16px;outline:none}
.login-box input:focus{border-color:#cf2026}
.login-box button{width:100%;padding:12px;border:0;border-radius:4px;background:#cf2026;color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.login-box button:hover{filter:brightness(1.1)}
.login-box .error{color:#cf2026;font-size:11px;margin-top:8px;display:none}

.admin{display:none;padding:20px;max-width:960px;margin:0 auto}
.admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #2a2d3a}
.admin-header h1{font-size:14px;color:#fff}
.admin-header .logout{background:none;border:1px solid #3a3d4a;color:#8d92a3;padding:6px 14px;border-radius:4px;font-size:11px;cursor:pointer}
.admin-header .logout:hover{border-color:#cf2026;color:#fff}

.tabs{display:flex;gap:4px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px}
.tab{padding:8px 16px;border:1px solid #2a2d3a;border-radius:4px;background:#1a1d27;color:#8d92a3;font-size:11px;cursor:pointer;white-space:nowrap;transition:all .2s}
.tab:hover{border-color:#cf2026;color:#fff}
.tab.active{background:#cf2026;border-color:#cf2026;color:#fff}

.panel{display:none}
.panel.active{display:block}

.field{margin-bottom:16px}
.field label{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8d92a3;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border:1px solid #2a2d3a;border-radius:4px;background:#11131a;color:#fff;font-size:13px;outline:none;font-family:inherit}
.field input:focus,.field textarea:focus{border-color:#cf2026}
.field textarea{min-height:80px;resize:vertical}

.section-title{font-size:12px;font-weight:700;color:#cf2026;margin:24px 0 12px;padding-bottom:6px;border-bottom:1px solid #2a2d3a}
.subsection{font-size:11px;font-weight:700;color:#fff;margin:16px 0 8px}

.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.img-card{position:relative;background:#1a1d27;border:1px solid #2a2d3a;border-radius:4px;overflow:hidden;aspect-ratio:4/3}
.img-card img{width:100%;height:100%;object-fit:cover}
.img-card .remove{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.7);color:#cf2026;border:0;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.img-card .remove:hover{background:#cf2026;color:#fff}

.drop-zone{border:2px dashed #3a3d4a;border-radius:6px;padding:24px;text-align:center;color:#717785;font-size:11px;cursor:pointer;transition:all .2s;margin-bottom:16px}
.drop-zone:hover,.drop-zone.dragover{border-color:#cf2026;color:#cf2026}
.drop-zone input{display:none}

.array-item{background:#1a1d27;border:1px solid #2a2d3a;border-radius:4px;padding:14px;margin-bottom:10px;position:relative}
.array-item .remove-item{position:absolute;top:8px;right:8px;background:none;border:1px solid #3a3d4a;color:#8d92a3;padding:3px 8px;border-radius:3px;font-size:10px;cursor:pointer}
.array-item .remove-item:hover{border-color:#cf2026;color:#cf2026}
.add-item{background:none;border:1px dashed #3a3d4a;color:#8d92a3;padding:8px;border-radius:4px;font-size:11px;cursor:pointer;width:100%;margin-bottom:16px}
.add-item:hover{border-color:#cf2026;color:#cf2026}

.save-bar{position:sticky;bottom:0;background:#0d0f15;border-top:1px solid #2a2d3a;padding:14px 0;margin-top:24px;display:flex;gap:12px;align-items:center}
.save-btn{padding:10px 28px;border:0;border-radius:4px;background:#cf2026;color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.save-btn:hover{filter:brightness(1.1)}
.save-btn:disabled{opacity:.5;cursor:wait}
.save-status{font-size:11px;color:#717785}
.save-status.ok{color:#4caf50}
.save-status.err{color:#cf2026}

@media(max-width:600px){
  .admin{padding:12px}
  .tabs{gap:2px}
  .tab{padding:6px 10px;font-size:10px}
  .img-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
}
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <h1>ПРОЕКТ-СВАРКА</h1>
    <p>Админ-панель управления контентом</p>
    <input type="password" id="password" placeholder="Пароль" autofocus>
    <button onclick="doLogin()">Войти</button>
    <div class="error" id="loginError">Неверный пароль</div>
  </div>
</div>

<div class="admin" id="adminPanel">
  <div class="admin-header">
    <h1>Админ-панель</h1>
    <button class="logout" onclick="doLogout()">Выйти</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
  <div class="save-bar">
    <button class="save-btn" id="saveBtn" onclick="doSave()">Сохранить</button>
    <span class="save-status" id="saveStatus"></span>
  </div>
</div>

<script>
let token = '';
let content = null;
let fileSha = '';
let currentTab = 'global';

const PAGES = [
  { id: 'global', label: 'Глобальное' },
  { id: 'home', label: 'Главная' },
  { id: 'loft', label: 'Лофт-мебель' },
  { id: 'prices', label: 'Цены' },
  { id: 'create', label: 'Создай своё' }
];

async function api(path, body, method = 'POST') {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (token) opts.headers['Authorization'] = `Bearer ${token}`;
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch('/api/admin-cms' + path, opts);
  return r.json();
}

async function doLogin() {
  const pw = document.getElementById('password').value;
  if (!pw) return;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  try {
    const res = await api('/auth', { password: pw });
    if (!res.ok) {
      errEl.textContent = res.error || 'Неверный пароль';
      errEl.style.display = 'block';
      return;
    }
    token = res.token;
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    await loadContent();
  } catch (e) {
    errEl.textContent = 'Ошибка сети: ' + e.message;
    errEl.style.display = 'block';
  }
}

document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function doLogout() {
  token = '';
  content = null;
  document.getElementById('adminPanel').style.display = 'none';
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('password').value = '';
  document.getElementById('loginError').style.display = 'none';
}

async function loadContent() {
  const res = await api('/content', null, 'GET');
  if (res.error) { alert(res.error); return; }
  content = res.content;
  fileSha = res.sha;
  renderTabs();
  renderPanel(currentTab);
}

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = PAGES.map(p => `<div class="tab${p.id === currentTab ? ' active' : ''}" onclick="switchTab('${p.id}')">${p.label}</div>`).join('');
}

function switchTab(id) {
  currentTab = id;
  renderTabs();
  renderPanel(id);
}

function renderPanel(id) {
  const el = document.getElementById('panels');
  const pages = { global: renderGlobal, home: renderHome, loft: renderLoft, prices: renderPrices, create: renderCreate };
  el.innerHTML = `<div class="panel active" id="panel-${id}">${(pages[id] || (() => ''))()}</div>`;
  bindDropZones();
}

function field(key, label, value, type = 'input') {
  const id = `f-${key.replace(/\./g, '-')}`;
  if (type === 'textarea') return `<div class="field"><label>${label}</label><textarea id="${id}" data-key="${key}">${esc(value || '')}</textarea></div>`;
  return `<div class="field"><label>${label}</label><input id="${id}" data-key="${key}" value="${esc(value || '')}"></div>`;
}

function imgGrid(key, images) {
  const imgs = Array.isArray(images) ? images : (images ? [images] : []);
  return `<div class="img-grid" data-key="${key}">${imgs.map((src, i) => `
    <div class="img-card">
      <img src="${src}" alt="">
      <button class="remove" onclick="removeImage('${key}',${i})">×</button>
    </div>`).join('')}</div>`;
}

function dropZone(key) {
  return `<div class="drop-zone" data-key="${key}">Перетащите фото или нажмите для выбора<input type="file" accept="image/*" multiple></div>`;
}

function arraySection(key, items, fields, label) {
  let html = `<div class="section-title">${label}</div>`;
  (items || []).forEach((item, i) => {
    html += `<div class="array-item"><button class="remove-item" onclick="removeArrayItem('${key}',${i})">Удалить</button>`;
    fields.forEach(f => {
      html += field(`${key}.${i}.${f.key}`, f.label, item[f.key], f.type || 'input');
    });
    html += `</div>`;
  });
  html += `<button class="add-item" onclick="addArrayItem('${key}',${JSON.stringify(fields.map(f => f.key)).replace(/"/g, '&quot;')})">+ Добавить</button>`;
  return html;
}

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function renderGlobal() {
  const g = content.global || {};
  return `<div class="section-title">Контакты и бренд</div>
    ${field('global.brand', 'Название бренда', g.brand)}
    ${field('global.phone', 'Телефон (код)', g.phone)}
    ${field('global.phoneFormatted', 'Телефон (отображение)', g.phoneFormatted)}
    ${field('global.email', 'Email', g.email)}
    ${field('global.telegram', 'Telegram', g.telegram)}
    ${field('global.telegramUrl', 'Telegram URL', g.telegramUrl)}
    ${field('global.footerDescription', 'Описание в футере', g.footerDescription, 'textarea')}
    ${field('global.footerBottom', 'Текст внизу футера', g.footerBottom)}`;
}

function renderHome() {
  const p = content.pages?.home || {};
  let html = `<div class="section-title">Hero</div>
    ${field('pages.home.hero_title', 'Заголовок', p.hero_title)}
    ${field('pages.home.hero_text', 'Текст', p.hero_text, 'textarea')}
    ${field('pages.home.hero_image', 'Фоновое фото', p.hero_image)}
    ${imgGrid('pages.home.hero_images', p.hero_images || [p.hero_image])}
    ${dropZone('pages.home.hero_images')}
    ${field('pages.home.hero_cta1_text', 'Кнопка 1 текст', p.hero_cta1_text)}
    ${field('pages.home.hero_cta1_href', 'Кнопка 1 ссылка', p.hero_cta1_href)}
    ${field('pages.home.hero_cta2_text', 'Кнопка 2 текст', p.hero_cta2_text)}
    ${field('pages.home.hero_cta2_href', 'Кнопка 2 ссылка', p.hero_cta2_href)}

    <div class="section-title">Вступление</div>
    ${field('pages.home.intro_title', 'Заголовок', p.intro_title)}
    ${field('pages.home.intro_text', 'Текст', p.intro_text, 'textarea')}

    <div class="section-title">Направления</div>
    ${field('pages.home.directions_eyebrow', 'Eyebrow', p.directions_eyebrow)}
    ${field('pages.home.directions_title', 'Заголовок', p.directions_title)}
    ${field('pages.home.directions_text', 'Текст', p.directions_text, 'textarea')}
    ${arraySection('pages.home.directions', p.directions, [
      { key: 'title', label: 'Название' },
      { key: 'text', label: 'Описание', type: 'textarea' },
      { key: 'image', label: 'Фото (путь)' }
    ], 'Карточки направлений')}
    ${dropZone('pages.home.directions_images')}

    <div class="section-title">Лофт-галерея</div>
    ${field('pages.home.loft_eyebrow', 'Eyebrow', p.loft_eyebrow)}
    ${field('pages.home.loft_title', 'Заголовок', p.loft_title)}
    ${field('pages.home.loft_text', 'Текст', p.loft_text, 'textarea')}
    ${arraySection('pages.home.loft_items', p.loft_items, [
      { key: 'caption', label: 'Подпись' },
      { key: 'image', label: 'Фото (путь)' }
    ], 'Фото галерея')}
    ${dropZone('pages.home.loft_images')}

    <div class="section-title">Заявка</div>
    ${field('pages.home.form_eyebrow', 'Eyebrow', p.form_eyebrow)}
    ${field('pages.home.form_title', 'Заголовок', p.form_title)}
    ${field('pages.home.form_text', 'Текст', p.form_text, 'textarea')}
    ${field('pages.home.form_submit', 'Кнопка', p.form_submit)}`;
  return html;
}

function renderLoft() {
  const p = content.pages?.loft || {};
  return `<div class="section-title">Hero</div>
    ${field('pages.loft.hero_title', 'Заголовок', p.hero_title)}
    ${field('pages.loft.hero_text', 'Текст', p.hero_text, 'textarea')}
    ${imgGrid('pages.loft.hero_images', p.hero_images || [p.hero_image])}
    ${dropZone('pages.loft.hero_images')}

    <div class="section-title">Почему металлокаркас</div>
    ${field('pages.loft.why_title', 'Заголовок', p.why_title)}
    ${field('pages.loft.why_text', 'Текст', p.why_text, 'textarea')}

    <div class="section-title">Изделия</div>
    ${field('pages.loft.products_eyebrow', 'Eyebrow', p.products_eyebrow)}
    ${field('pages.loft.products_title', 'Заголовок', p.products_title)}
    ${field('pages.loft.products_text', 'Текст', p.products_text, 'textarea')}
    ${arraySection('pages.loft.products', p.products, [
      { key: 'title', label: 'Название' },
      { key: 'text', label: 'Описание', type: 'textarea' },
      { key: 'image', label: 'Фото (путь)' },
      { key: 'price', label: 'Цена' }
    ], 'Карточки изделий')}
    ${dropZone('pages.loft.products_images')}

    <div class="section-title">Процесс</div>
    ${field('pages.loft.process_title', 'Заголовок', p.process_title)}
    ${field('pages.loft.process_text', 'Текст', p.process_text, 'textarea')}
    ${field('pages.loft.process_cta1', 'Кнопка 1', p.process_cta1)}
    ${field('pages.loft.process_cta1_href', 'Кнопка 1 ссылка', p.process_cta1_href)}`;
}

function renderPrices() {
  const p = content.pages?.prices || {};
  let html = `<div class="section-title">Hero</div>
    ${field('pages.prices.hero_title', 'Заголовок', p.hero_title)}
    ${field('pages.prices.hero_text', 'Текст', p.hero_text, 'textarea')}

    <div class="section-title">Таблица цен</div>
    ${arraySection('pages.prices.rows', p.rows, [
      { key: 'work', label: 'Вид работ' },
      { key: 'price', label: 'Стоимость' }
    ], 'Обычные строки')}
    ${arraySection('pages.prices.special_rows', p.special_rows, [
      { key: 'work', label: 'Вид работ' },
      { key: 'price', label: 'Стоимость' }
    ], 'Особые строки (красные)')}

    <div class="section-title">CTA</div>
    ${field('pages.prices.cta_title', 'Заголовок', p.cta_title)}
    ${field('pages.prices.cta_text', 'Текст', p.cta_text, 'textarea')}
    ${field('pages.prices.cta1', 'Кнопка 1', p.cta1)}
    ${field('pages.prices.cta1_href', 'Кнопка 1 ссылка', p.cta1_href)}`;
  return html;
}

function renderCreate() {
  const p = content.pages?.create || {};
  return `<div class="section-title">Hero</div>
    ${field('pages.create.hero_title', 'Заголовок', p.hero_title)}
    ${field('pages.create.hero_text', 'Текст', p.hero_text, 'textarea')}

    <div class="section-title">Форма</div>
    ${field('pages.create.card_title', 'Заголовок карточки', p.card_title)}
    ${field('pages.create.hint', 'Подсказка', p.hint, 'textarea')}
    ${field('pages.create.field_label', 'Метка поля', p.field_label)}
    ${field('pages.create.placeholder', 'Placeholder', p.placeholder)}
    ${field('pages.create.drop_title', 'Зона загрузки', p.drop_title)}
    ${field('pages.create.drop_text', 'Текст зоны', p.drop_text)}
    ${field('pages.create.submit_text', 'Кнопка', p.submit_text)}`;
}

function removeImage(key, index) {
  const parts = key.split('.');
  let obj = content;
  for (let i = 0; i < parts.length; i++) obj = obj[parts[i]];
  if (Array.isArray(obj)) obj.splice(index, 1);
  else if (typeof obj === 'string') {
    let parent = content;
    for (let i = 0; i < parts.length - 1; i++) parent = parent[parts[i]];
    parent[parts[parts.length - 1]] = '';
  }
  renderPanel(currentTab);
}

function removeArrayItem(key, index) {
  const parts = key.split('.');
  let obj = content;
  for (let i = 0; i < parts.length; i++) obj = obj[parts[i]];
  if (Array.isArray(obj)) obj.splice(index, 1);
  renderPanel(currentTab);
}

function addArrayItem(key, fieldKeys) {
  const parts = key.split('.');
  let obj = content;
  for (let i = 0; i < parts.length; i++) { if (!obj[parts[i]]) obj[parts[i]] = []; obj = obj[parts[i]]; }
  const item = {};
  fieldKeys.forEach(f => item[f] = '');
  obj.push(item);
  renderPanel(currentTab);
}

function bindDropZones() {
  document.querySelectorAll('.drop-zone').forEach(zone => {
    const input = zone.querySelector('input');
    zone.onclick = () => input.click();
    zone.ondragover = e => { e.preventDefault(); zone.classList.add('dragover'); };
    zone.ondragleave = () => zone.classList.remove('dragover');
    zone.ondrop = e => { e.preventDefault(); zone.classList.remove('dragover'); handleFiles(e.dataTransfer.files, zone.dataset.key); };
    input.onchange = e => handleFiles(e.target.files, zone.dataset.key);
  });
}

async function handleFiles(files, targetKey) {
  for (const file of files) {
    const reader = new FileReader();
    const base64 = await new Promise(resolve => {
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.readAsDataURL(file);
    });
    const r = await fetch('/api/admin-cms', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ filename: file.name, data: base64 })
    });
    const res = await r.json();
    if (res.ok && res.url) {
      const parts = targetKey.split('.');
      let obj = content;
      for (let i = 0; i < parts.length; i++) { if (!obj[parts[i]]) obj[parts[i]] = []; obj = obj[parts[i]]; }
      if (!Array.isArray(obj)) {
        let parent = content;
        for (let i = 0; i < parts.length - 1; i++) parent = parent[parts[i]];
        parent[parts[parts.length - 1]] = [obj];
        obj = parent[parts[parts.length - 1]];
      }
      obj.push(res.url);
    }
  }
  renderPanel(currentTab);
}

function collectForm() {
  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.dataset.key;
    if (el.classList.contains('drop-zone')) return;
    const parts = key.split('.');
    let obj = content;
    for (let i = 0; i < parts.length - 1; i++) {
      if (!obj[parts[i]]) obj[parts[i]] = {};
      obj = obj[parts[i]];
    }
    const lastKey = parts[parts.length - 1];
    if (el.tagName === 'TEXTAREA') obj[lastKey] = el.value;
    else obj[lastKey] = el.value;
  });
}

async function doSave() {
  const btn = document.getElementById('saveBtn');
  const status = document.getElementById('saveStatus');
  btn.disabled = true;
  status.textContent = 'Сохранение...';
  status.className = 'save-status';
  collectForm();
  const res = await api('/save', { content, sha: fileSha });
  btn.disabled = false;
  if (res.ok) {
    status.textContent = 'Сохранено! Vercel задеплоит через 1-2 минуты.';
    status.className = 'save-status ok';
  } else {
    status.textContent = 'Ошибка: ' + (res.error || 'неизвестная');
    status.className = 'save-status err';
  }
}
</script>
</body>
</html>
